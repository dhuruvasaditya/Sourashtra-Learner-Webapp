<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sourashtra">
<meta name="theme-color" content="#f7f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Sourashtra</title>
<style>
:root{
  --bg:#f7f5f2; --card:#fff; --ink:#1b1b1f; --muted:#6b6b73; --line:#e4e0da;
  --accent:#b4451f; --accent-ink:#fff; --good:#1f7a4d; --again:#a33a2a;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16161a; --card:#212127; --ink:#f0eeea; --muted:#9a9aa3; --line:#32323a;
    --accent:#e06b3d; --accent-ink:#1b1b1f; --good:#4ec18a; --again:#e8836f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-text-size-adjust:100%;
}
#app{max-width:640px;margin:0 auto;padding:20px 18px 40px;min-height:100vh}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:15px;margin:0 0 26px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{
  display:block;width:100%;padding:17px;border-radius:14px;background:var(--card);
  border:1px solid var(--line);font-size:17px;font-weight:500;text-align:center;
  margin-bottom:10px;box-shadow:var(--shadow);
}
.btn:active{transform:scale(.985)}
.btn .mhint{display:block;font-size:13px;font-weight:400;opacity:.7;margin-top:3px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.good{background:var(--good);color:#fff;border-color:transparent;font-weight:600}
.btn.again{background:transparent;color:var(--again);border-color:currentColor}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{margin-bottom:0}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.back{color:var(--muted);font-size:16px;padding:6px 0}
.bar{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:28px 22px;box-shadow:var(--shadow);margin-bottom:22px;
}
.stagetag{
  font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-bottom:18px;
}
.sa{font-size:32px;font-weight:600;letter-spacing:-.02em;margin:0 0 8px;line-height:1.2}
.en{font-size:26px;font-weight:500;margin:0 0 8px;line-height:1.3}
.lit{color:var(--muted);font-size:15px;font-style:italic;margin:0 0 6px}
.note{
  color:var(--muted);font-size:14px;margin:16px 0 0;padding-top:14px;
  border-top:1px solid var(--line);
}
.ask{color:var(--muted);font-size:15px;margin:14px 0 0}
.play{
  display:inline-flex;align-items:center;gap:9px;padding:13px 22px;border-radius:100px;
  background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;margin:6px 0;
}
.play.ghost{background:transparent;color:var(--accent);border:1px solid currentColor}
.play[disabled]{opacity:.35}
.search{
  width:100%;padding:14px 16px;font-size:17px;border-radius:12px;background:var(--card);
  color:var(--ink);border:1px solid var(--line);margin-bottom:20px;
}
.grouphead{
  font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin:26px 0 10px;
}
.item{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;
}
.item:active{background:var(--bg)}
.item .txt{flex:1;min-width:0}
.item .t1{font-size:18px;font-weight:600;margin-bottom:2px}
.item .t2{font-size:15px;color:var(--muted)}
.item .t3{font-size:13px;color:var(--muted);font-style:italic;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.b1{background:var(--again)} .dot.b2,.dot.b3{background:var(--accent)}
.dot.b4,.dot.b5{background:var(--good)}
.spk{font-size:19px;opacity:.5;flex:none}
.empty{color:var(--muted);text-align:center;padding:50px 20px;font-size:16px}
.stats{display:flex;gap:8px;margin:0 0 24px}
.stat{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 8px;text-align:center;font:inherit;color:inherit;cursor:pointer;
}
.stat:active{transform:scale(.97)}
.stat[disabled]{opacity:.45;cursor:default}
.stat b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tiny{color:var(--muted);font-size:13px;text-align:center;margin-top:28px;line-height:1.7}
.tiny a{color:var(--muted)}
textarea{
  width:100%;height:110px;font:12px/1.4 ui-monospace,Menlo,monospace;padding:12px;
  border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  margin-bottom:10px;
}
.opt{
  display:block;width:100%;padding:15px 17px;border-radius:12px;background:var(--card);
  border:1px solid var(--line);text-align:left;font-size:17px;margin-bottom:9px;
  box-shadow:var(--shadow);
}
.opt:active{transform:scale(.99)}
.opt.right{background:var(--good);color:#fff;border-color:transparent;font-weight:600}
.opt.wrong{background:var(--again);color:#fff;border-color:transparent;font-weight:600}
.catrow{margin-bottom:18px}
.cathead{
  display:flex;justify-content:space-between;align-items:baseline;
  gap:12px;margin-bottom:7px;
}
.cathead .nm{font-size:17px;font-weight:600}
.cathead span{font-size:13px;color:var(--muted);white-space:nowrap}
.score{font-size:56px;font-weight:700;letter-spacing:-.04em;margin:0 0 2px;line-height:1}
.done{text-align:center;padding:36px 12px}
.done .big{font-size:44px;margin-bottom:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ---------- constants ------------------------------------------------- */
const STORE = "saurashtra.progress.v1";
const QUIZ_STORE = "saurashtra.quiz.v1";
const QUIZ_LEN = 10;          // questions per quiz, or the whole category if smaller
const QUIZ_OPTIONS = 4;
const SESSION_MAX = 20;
const SOLID = 3;            // "got it" this many times in a row = solid

let PHRASES = [];
let CATS = {};              // id -> label, ordered
let progress = {};          // id -> {got: n}   n = correct answers in a row
let quizScores = {};        // "mode:category" -> {score, total}

/* ---------- storage --------------------------------------------------- */
function loadProgress(){
  try { progress = JSON.parse(localStorage.getItem(STORE)) || {}; }
  catch(e){ progress = {}; }
  // Older versions stored Leitner boxes and due dates. Carry that work over
  // rather than resetting anyone: box 1 meant "seen but wrong", box 5 "known".
  let migrated = false;
  for (const [id, v] of Object.entries(progress)){
    if (v && typeof v.got !== "number"){
      progress[id] = {got: Math.max(0, (v.box || 1) - 1)};
      migrated = true;
    }
  }
  if (migrated) saveProgress();
}
function saveProgress(){
  try { localStorage.setItem(STORE, JSON.stringify(progress)); }
  catch(e){ /* private mode — session still works, just won't persist */ }
}
function loadQuizScores(){
  try { quizScores = JSON.parse(localStorage.getItem(QUIZ_STORE)) || {}; }
  catch(e){ quizScores = {}; }
}
function saveQuizScores(){
  try { localStorage.setItem(QUIZ_STORE, JSON.stringify(quizScores)); } catch(e){}
}
const quizKey = (mode, cid) => `${mode}:${cid || "all"}`;

function resetProgress(){
  progress = {}; quizScores = {};
  try { localStorage.removeItem(STORE); localStorage.removeItem(QUIZ_STORE); } catch(e){}
}

/* ---------- progress -------------------------------------------------- */
let forcedStage = null;     // set by the practice-mode buttons on the home screen
let chosenCat  = null;      // null means the mixed session
let chosenStreak = null;    // set when drilling one "got it" group

const gotCount = p => (progress[p.id] ? progress[p.id].got : 0);
const started  = p => !!progress[p.id];

function stageFor(p){
  // A phrase with no recording cannot be guessed from audio.
  return (forcedStage === "listen" && p.audio) ? "listen" : "recall";
}
function grade(p, ok){
  progress[p.id] = {got: ok ? gotCount(p) + 1 : 0};
  saveProgress();
}

function atStreak(p, streak){
  return streak === "solid" ? gotCount(p) >= SOLID
                            : started(p) && gotCount(p) === Number(streak);
}
const streakLabel = streak => streak === "solid" ? `Got ${SOLID}+` : `Got ${streak}`;

function buildSession(mode, cid, streak){
  let pool = mode === "listen" ? PHRASES.filter(p => p.audio) : PHRASES;
  if (cid) pool = pool.filter(p => p.category === cid);
  // Drilling one group: they all sit at the same level, so just shuffle.
  if (streak) return shuffle(pool.filter(p => atStreak(p, streak))).slice(0, SESSION_MAX);
  // Otherwise weakest first: never-seen and just-missed before ones you know.
  // Shuffled within each tier so the order still varies run to run.
  const tiers = {};
  for (const item of pool) (tiers[gotCount(item)] ||= []).push(item);
  return Object.keys(tiers).sort((a,b) => a - b)
    .flatMap(k => shuffle(tiers[k]))
    .slice(0, SESSION_MAX);
}
function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- audio ----------------------------------------------------- */
/* One shared element, unlocked by the first tap. iOS refuses programmatic
   playback otherwise, which would silently break the Listen stage. */
const player = new Audio();
let unlocked = false;
function unlock(){
  if (unlocked) return;
  unlocked = true;
  player.play().catch(()=>{});
  player.pause();
}
document.addEventListener("touchend", unlock, {once:true});
document.addEventListener("click", unlock, {once:true});

function play(file){
  if (!file) return;
  player.src = "audio/" + file;
  player.currentTime = 0;
  player.play().catch(()=>{});
}
function playWait(file){
  return new Promise(res => {
    if (!file) return res();
    const done = () => { player.removeEventListener("ended", done); res(); };
    player.addEventListener("ended", done);
    player.src = "audio/" + file;
    player.currentTime = 0;
    player.play().catch(() => done());
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- tiny view helpers ----------------------------------------- */
const app = document.getElementById("app");
const esc = s => (s||"").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function show(html){ app.innerHTML = html; window.scrollTo(0,0); }
function on(sel, ev, fn){ app.querySelectorAll(sel).forEach(el => el.addEventListener(ev, fn)); }
function topbar(pct, label){
  return `<div class="topbar"><button class="back" data-home>‹ Done</button>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <span class="count">${label}</span></div>`;
}
function bindHome(){ on("[data-home]","click",home); }

/* ---------- home ------------------------------------------------------ */
function home(){
  stopListen();
  forcedStage = null;
  chosenCat = null;
  chosenStreak = null;
  quiz = [];
  const fresh = PHRASES.filter(p => !started(p)).length;
  const at = n => PHRASES.filter(p => started(p) && gotCount(p) === n).length;
  const solid = PHRASES.filter(p => gotCount(p) >= SOLID).length;
  const withAudio = PHRASES.filter(p => p.audio).length;
  show(`
    <h1>Sourashtra</h1>
    <p class="sub">${PHRASES.length} phrases · ${fresh} not started</p>
    <div class="stats">
      <button class="stat" data-streak="1" ${at(1) ? "" : "disabled"}>
        <b>${at(1)}</b><span>Got 1</span></button>
      <button class="stat" data-streak="2" ${at(2) ? "" : "disabled"}>
        <b>${at(2)}</b><span>Got 2</span></button>
      <button class="stat" data-streak="solid" ${solid ? "" : "disabled"}>
        <b>${solid}</b><span>Got ${SOLID}+</span></button>
    </div>
    <div class="grouphead">Practice</div>
    <button class="btn primary" data-mode="recall">
      English → Sourashtra
      <span class="mhint">read the English, say it, then hear the answer</span>
    </button>
    <button class="btn" data-mode="listen">
      Sourashtra → English
      <span class="mhint">hear it and work out the meaning · ${withAudio} with audio</span>
    </button>
    <div class="grouphead">Reference</div>
    <button class="btn" data-browse>Browse</button>
    <button class="btn" data-listen>Listen hands-free</button>
    <p class="tiny">
      <a href="#" data-export>Export progress</a> ·
      <a href="#" data-import>Import</a> ·
      <a href="#" data-reset>Reset everything</a>
    </p>`);
  on("[data-mode]","click",e=>pickCategory(e.currentTarget.dataset.mode));
  // tapping a tile drills exactly that group, no category step
  on("[data-streak]","click",e=>startPractice("recall", null, e.currentTarget.dataset.streak));
  on("[data-browse]","click",browse);
  on("[data-listen]","click",listenPicker);
  on("[data-export]","click",e=>{e.preventDefault();exportProgress()});
  on("[data-import]","click",e=>{e.preventDefault();importProgress()});
  on("[data-reset]","click",e=>{e.preventDefault();confirmReset()});
}

/* ---------- practice -------------------------------------------------- */
let session = [], idx = 0;

const MODE_NAME = {recall: "English → Sourashtra", listen: "Sourashtra → English"};

/* Choose what to practise before starting. Going straight into a mixed session
   makes it impossible to drill the one category you actually need today. */
function catRow(mode, cid, rows){
  const label = cid ? CATS[cid] : "Everything, mixed";
  const done  = rows.filter(started).length;
  const last  = quizScores[quizKey(mode, cid)];
  const canQuiz = rows.length >= 2;   // a quiz needs something to choose between
  return `<div class="catrow">
    <div class="cathead"><span class="nm">${esc(label)}</span>
      <span>${done}/${rows.length} done</span></div>
    <div class="row2">
      <button class="btn" data-cat="${cid || ""}" data-kind="cards">Flashcards</button>
      <button class="btn" data-cat="${cid || ""}" data-kind="quiz" ${canQuiz ? "" : "disabled"}>Quiz
        <span class="mhint">${last ? `last ${last.score}/${last.total}` : "not tried"}</span>
      </button>
    </div>
  </div>`;
}

function pickCategory(mode){
  const pool = mode === "listen" ? PHRASES.filter(p => p.audio) : PHRASES;

  let html = `<div class="topbar"><button class="back" data-home>‹ Home</button></div>
    <h1>${esc(MODE_NAME[mode])}</h1>
    <p class="sub">Flashcards to learn, quiz to check yourself.</p>
    ${catRow(mode, null, pool)}
    <div class="grouphead">By category</div>`;

  for (const cid of Object.keys(CATS)){
    const rows = pool.filter(p => p.category === cid);
    if (rows.length) html += catRow(mode, cid, rows);
  }
  show(html);
  bindHome();
  on("[data-cat]","click",e=>{
    const cid = e.currentTarget.dataset.cat || null;
    if (e.currentTarget.dataset.kind === "quiz") startQuiz(mode, cid);
    else startPractice(mode, cid);
  });
}

function startPractice(mode, cid, streak){
  forcedStage = mode || null;
  chosenCat = cid || null;
  chosenStreak = streak || null;
  session = buildSession(mode, cid, streak);
  idx = 0;
  if (!session.length){
    show(`<div class="done"><div class="big">—</div>
      <h1>Nothing here yet</h1>
      <p class="sub">${streak
        ? "No phrases at " + esc(streakLabel(streak)) + " any more."
        : (cid ? esc(CATS[cid]) + " has" : "There are") + " no phrases with audio."}</p>
      <button class="btn primary" data-back>Pick a category</button>
      <button class="btn" data-home>Home</button></div>`);
    bindHome();
    on("[data-back]","click",()=>pickCategory(mode));
    return;
  }
  card();
}

function card(){
  if (idx >= session.length) return finished();
  const p = session[idx];
  const stage = stageFor(p);
  const pct = Math.round(idx / session.length * 100);
  const scope = chosenStreak ? streakLabel(chosenStreak) : (chosenCat ? CATS[chosenCat] : "");
  const head = topbar(pct, `${scope ? scope + " · " : ""}${idx+1}/${session.length}`);
  const tag = stage === "listen" ? "Listen" : "Say it";

  const body = stage === "listen"
    ? `<button class="play" data-play>▶ Play again</button>
       <p class="ask">What does this mean?</p>`
    : `<p class="en">${esc(p.en)}</p>
       <p class="ask">Say it out loud in Sourashtra.</p>`;

  show(`${head}<div class="card"><div class="stagetag">${tag}</div>${body}</div>
        <button class="btn primary" data-reveal>Reveal</button>`);

  bindHome();
  on("[data-play]","click",()=>play(p.audio));
  on("[data-reveal]","click",()=>reveal(p, stage));
  if (stage === "listen") play(p.audio);
}

function reveal(p, stage){
  const pct = Math.round((idx + 0.5) / session.length * 100);
  show(`${topbar(pct, `${idx+1}/${session.length}`)}
    <div class="card">
      <p class="sa">${esc(p.sa)}</p>
      <p class="en">${esc(p.en)}</p>
      ${p.lit ? `<p class="lit">${esc(p.lit)}</p>` : ""}
      ${p.audio ? `<button class="play ghost" data-play>▶ Play</button>` : ""}
      ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
    </div>
    <div class="row2">
      <button class="btn again" data-again>Again</button>
      <button class="btn good" data-got>Got it</button>
    </div>`);
  bindHome();
  on("[data-play]","click",()=>play(p.audio));
  on("[data-again]","click",()=>{
    grade(p,false);
    session.push(p);          // comes back before the session ends
    idx++; card();
  });
  on("[data-got]","click",()=>{ grade(p,true); idx++; card(); });
  if (stage !== "listen" && p.audio) play(p.audio);
}

function finished(){
  const where = chosenStreak ? esc(streakLabel(chosenStreak))
              : chosenCat ? esc(CATS[chosenCat]) : "Mixed";
  const pool = chosenCat ? PHRASES.filter(p => p.category === chosenCat) : PHRASES;
  show(`<div class="done"><div class="big">🎉</div>
    <h1>${where} done</h1>
    <p class="sub">${session.length} cards · ${pool.filter(p => gotCount(p) >= SOLID).length}
      of ${pool.length} now at ${SOLID}+ in a row</p>
    <button class="btn primary" data-again>Practise these again</button>
    <button class="btn" data-pick>Different category</button>
    <button class="btn" data-home>Home</button></div>`);
  bindHome();
  on("[data-again]","click",()=>startPractice(forcedStage, chosenCat, chosenStreak));
  on("[data-pick]","click",()=>pickCategory(forcedStage));
}

/* ---------- quiz ------------------------------------------------------ */
/* Multiple choice, so the result is an actual score rather than a self
   assessment. Deliberately does not touch the flashcard streaks — this is the
   measurement, not the practice. */

let quiz = [], qIdx = 0, qScore = 0, quizMode = null, quizCat = null;

function buildQuiz(mode, cid){
  let pool = mode === "listen" ? PHRASES.filter(p => p.audio) : PHRASES;
  if (cid) pool = pool.filter(p => p.category === cid);

  return shuffle(pool).slice(0, QUIZ_LEN).map(answer => {
    // Wrong answers come from the same category first — picking "Food" out of
    // three greetings would be too easy to be worth asking.
    let wrong = shuffle(pool.filter(x => x.id !== answer.id)).slice(0, QUIZ_OPTIONS - 1);
    if (wrong.length < QUIZ_OPTIONS - 1){
      const ids = new Set([answer.id, ...wrong.map(x => x.id)]);
      wrong = wrong.concat(shuffle(PHRASES.filter(x => !ids.has(x.id)))
                            .slice(0, QUIZ_OPTIONS - 1 - wrong.length));
    }
    return {answer, options: shuffle([answer, ...wrong])};
  });
}

function startQuiz(mode, cid){
  quizMode = mode; quizCat = cid;
  quiz = buildQuiz(mode, cid);
  qIdx = 0; qScore = 0;
  question();
}

function question(){
  if (qIdx >= quiz.length) return quizDone();
  const q = quiz[qIdx];
  const pct = Math.round(qIdx / quiz.length * 100);
  const asking = quizMode === "listen";

  const prompt = asking
    ? `<button class="play" data-play>▶ Play again</button>
       <p class="ask">Which one is it?</p>`
    : `<p class="en">${esc(q.answer.en)}</p>
       <p class="ask">Which one is it?</p>`;

  show(`${topbar(pct, `${qIdx+1}/${quiz.length} · ${qScore} right`)}
    <div class="card">${prompt}</div>
    ${q.options.map((o,i) =>
      `<button class="opt" data-i="${i}">${esc(asking ? o.en : o.sa)}</button>`).join("")}`);

  bindHome();
  on("[data-play]","click",()=>play(q.answer.audio));
  on("[data-i]","click",e=>answer(q, Number(e.currentTarget.dataset.i)));
  if (asking) play(q.answer.audio);
}

function answer(q, chosen){
  const picked = q.options[chosen];
  const right = picked.id === q.answer.id;
  if (right) qScore++;

  // Freeze the options, mark the right one, and show what went wrong.
  [...document.querySelectorAll(".opt")].forEach((el, i) => {
    el.disabled = true;
    if (q.options[i].id === q.answer.id) el.classList.add("right");
    else if (i === chosen) el.classList.add("wrong");
  });
  document.querySelector(".count").textContent =
    `${qIdx+1}/${quiz.length} · ${qScore} right`;

  // In listen mode the transliteration was never shown, so reveal it. In recall
  // mode it is already highlighted green above — only the gloss adds anything.
  const reveal = quizMode === "listen"
    ? esc(q.answer.sa) + (q.answer.lit ? " — " + esc(q.answer.lit) : "")
    : esc(q.answer.lit || "");
  if (reveal){
    document.querySelector(".card").insertAdjacentHTML("beforeend",
      `<p class="lit" style="margin-top:14px">${reveal}</p>`);
  }
  if (q.answer.audio) play(q.answer.audio);

  const next = document.createElement("button");
  next.className = "btn primary";
  next.textContent = qIdx + 1 < quiz.length ? "Next" : "See score";
  next.addEventListener("click", () => { qIdx++; question(); });
  document.getElementById("app").appendChild(next);
}

function quizDone(){
  const key = quizKey(quizMode, quizCat);
  const previous = quizScores[key];
  quizScores[key] = {score: qScore, total: quiz.length};
  saveQuizScores();

  const pctScore = Math.round(qScore / quiz.length * 100);
  const where = quizCat ? esc(CATS[quizCat]) : "Everything";
  const verdict = pctScore === 100 ? "Perfect." : pctScore >= 80 ? "Strong."
                : pctScore >= 50 ? "Getting there." : "Worth some flashcards.";
  const change = previous
    ? `Last time ${previous.score}/${previous.total}.`
    : "First time through.";

  show(`<div class="done">
      <p class="score">${qScore}/${quiz.length}</p>
      <h1>${where}</h1>
      <p class="sub">${verdict} ${change}</p>
      <button class="btn primary" data-retry>Try again</button>
      <button class="btn" data-cards>Practise these with flashcards</button>
      <button class="btn" data-pick>Different category</button>
      <button class="btn" data-home>Home</button>
    </div>`);
  bindHome();
  on("[data-retry]","click",()=>startQuiz(quizMode, quizCat));
  on("[data-cards]","click",()=>startPractice(quizMode, quizCat));
  on("[data-pick]","click",()=>pickCategory(quizMode));
}

/* ---------- browse ---------------------------------------------------- */
function browse(){
  const draw = (q="") => {
    const needle = q.toLowerCase().trim();
    const hits = PHRASES.filter(p =>
      !needle || p.en.toLowerCase().includes(needle) || p.sa.toLowerCase().includes(needle));
    let html = "";
    for (const cid of Object.keys(CATS)){
      const rows = hits.filter(p => p.category === cid);
      if (!rows.length) continue;
      html += `<div class="grouphead">${esc(CATS[cid])}</div>`;
      for (const p of rows){
        const box = Math.min(gotCount(p) + (started(p) ? 1 : 0), 5);
        html += `<button class="item" data-id="${p.id}">
          <span class="dot b${box}"></span>
          <span class="txt">
            <span class="t1">${esc(p.sa)}</span>
            <span class="t2">${esc(p.en)}</span>
            ${p.lit ? `<span class="t3">${esc(p.lit)}</span>` : ""}
          </span>
          ${p.audio ? `<span class="spk">▶</span>` : ""}
        </button>`;
      }
    }
    return html || `<p class="empty">No match for “${esc(q)}”</p>`;
  };

  show(`<div class="topbar"><button class="back" data-home>‹ Home</button></div>
    <input class="search" id="q" placeholder="Search English or Sourashtra"
           autocapitalize="off" autocorrect="off" spellcheck="false">
    <div id="list">${draw()}</div>`);
  bindHome();

  const list = document.getElementById("list");
  const wire = () => list.querySelectorAll(".item").forEach(el =>
    el.addEventListener("click", () => {
      const p = PHRASES.find(x => x.id === el.dataset.id);
      if (p) play(p.audio);
    }));
  wire();
  document.getElementById("q").addEventListener("input", e => {
    list.innerHTML = draw(e.target.value); wire();
  });
}

/* ---------- listen ---------------------------------------------------- */
let listening = false;

function listenPicker(){
  let html = `<div class="topbar"><button class="back" data-home>‹ Home</button></div>
    <h1>Listen</h1>
    <p class="sub">Plays each phrase with a pause to repeat. Read along on screen.</p>`;
  for (const cid of Object.keys(CATS)){
    const n = PHRASES.filter(p => p.category === cid && p.audio).length;
    if (!n) continue;
    html += `<button class="btn" data-cat="${cid}">${esc(CATS[cid])}
      <span class="count"> · ${n}</span></button>`;
  }
  const total = PHRASES.filter(p => p.audio).length;
  if (!total) html += `<p class="empty">No audio recorded yet.</p>`;
  show(html);
  bindHome();
  on("[data-cat]","click",e=>runListen(e.currentTarget.dataset.cat));
}

async function runListen(cid){
  const items = PHRASES.filter(p => p.category === cid && p.audio);
  listening = true;
  for (let i = 0; i < items.length && listening; i++){
    const p = items[i];
    show(`${topbar(Math.round(i/items.length*100), `${i+1}/${items.length}`)}
      <div class="card">
        <p class="sa">${esc(p.sa)}</p>
        <p class="en">${esc(p.en)}</p>
        ${p.lit ? `<p class="lit">${esc(p.lit)}</p>` : ""}
      </div>
      <button class="btn again" data-stop>Stop</button>`);
    on("[data-home]","click",()=>{stopListen();home()});
    on("[data-stop]","click",()=>{stopListen();listenPicker()});

    await playWait(p.audio);
    if (!listening) return;
    await sleep(2500);                 // learner repeats it, reading the card
  }
  if (listening){ listening = false; listenPicker(); }
}
function stopListen(){
  listening = false;
  player.pause();
}

/* ---------- export / import ------------------------------------------- */
function exportProgress(){
  show(`<div class="topbar"><button class="back" data-home>‹ Home</button></div>
    <h1>Export</h1>
    <p class="sub">Copy this and keep it somewhere. Paste it into Import on a new phone.</p>
    <textarea readonly id="blob">${esc(JSON.stringify(progress))}</textarea>
    <button class="btn primary" data-copy>Copy</button>`);
  bindHome();
  on("[data-copy]","click",async e=>{
    const t = document.getElementById("blob");
    t.select(); t.setSelectionRange(0, 99999);
    try { await navigator.clipboard.writeText(t.value); e.target.textContent = "Copied ✓"; }
    catch(err){ e.target.textContent = "Select the text and copy it"; }
  });
}
function confirmReset(){
  const n = Object.keys(progress).length;
  show(`<div class="topbar"><button class="back" data-home>‹ Home</button></div>
    <h1>Reset everything</h1>
    <p class="sub">This clears every "got it" count and quiz score on this device and starts
      all ${PHRASES.length} phrases from scratch. The phrases and recordings stay.
      It cannot be undone.</p>
    ${n ? `<button class="btn again" data-go>Reset ${n} phrases</button>`
        : `<p class="empty">Nothing to reset — no progress yet.</p>`}
    <button class="btn" data-home>Cancel</button>`);
  bindHome();
  on("[data-go]","click",()=>{ resetProgress(); home(); });
}

function importProgress(){
  show(`<div class="topbar"><button class="back" data-home>‹ Home</button></div>
    <h1>Import</h1>
    <p class="sub">Paste an exported blob. This replaces your current progress.</p>
    <textarea id="blob" placeholder='{"0001":{"box":2,...}}'></textarea>
    <button class="btn primary" data-go>Replace progress</button>`);
  bindHome();
  on("[data-go]","click",()=>{
    try {
      const parsed = JSON.parse(document.getElementById("blob").value);
      if (typeof parsed !== "object" || Array.isArray(parsed)) throw new Error("not an object");
      progress = parsed; saveProgress(); home();
    } catch(err){
      alert("That doesn't look like a valid export.\n\n" + err.message);
    }
  });
}

/* ---------- boot ------------------------------------------------------ */
async function boot(){
  loadProgress();
  loadQuizScores();
  try {
    const [phrases, prompts] = await Promise.all([
      fetch("phrases.json").then(r => r.json()),
      fetch("prompts.json").then(r => r.json()).catch(() => null)
    ]);
    PHRASES = phrases.filter(p => p.sa && p.en);
    if (prompts) prompts.categories.forEach(c => CATS[c.id] = c.label);
    // any category present in the data but missing from prompts.json
    PHRASES.forEach(p => { if (!CATS[p.category]) CATS[p.category] = p.category; });
    home();
  } catch(err){
    show(`<h1>Couldn't load phrases</h1>
      <p class="sub">${esc(err.message)}</p>
      <p class="tiny">If you opened this file directly, run a local server instead:<br>
      <code>python3 -m http.server</code> in the <code>web/</code> folder.</p>`);
  }
}
boot();
</script>
